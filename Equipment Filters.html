<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipment Filters</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#e6a100;--acx:#1d1d1b;--bd:#ddd;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#232321;--tx:#f0f0ec;--mut:#9a9a94;--bd:#3a3a36;--ac:#f0b429;--acx:#161615}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.home h1{color:#1d1d1b}
#bg{position:fixed;inset:0;z-index:-1;display:none;background-size:92% auto;background-repeat:no-repeat;background-position:center 58%;background-color:#fff}
.home #bg{display:block}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.on{background:var(--tx);color:var(--bg)}
button.d{color:var(--rd)}
input,select,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.big{font-size:20px;padding:16px;text-align:center}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px}
.c h3{margin:0 0 8px;font-size:17px}
.r{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.r:first-of-type{border-top:0}
.t{color:var(--mut)}
.n{font-weight:700;direction:ltr;unicode-bidi:plaintext}
.m{color:var(--mut);text-align:center;margin-top:24px}
.home .m{color:#555}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:10px}
.row select{grid-column:1/-1}
.row button{padding:8px}
.g{display:flex;gap:8px;margin-top:12px}
.g>*{flex:1}
.hide{display:none}
label{display:block;margin-top:12px;color:var(--mut);font-size:14px}
</style>
</head>
<body class="home"><div id="bg"></div>
<div class="w">
<h1>🔧 Equipment Filters</h1>
<div class="tabs"><button id="t1" class="on">Search</button><button id="t2">Manage Data</button></div>

<section id="s1">
<input id="q" class="big" placeholder="Enter equipment number" inputmode="text" autocomplete="off">
<div id="res"></div>
</section>

<section id="s2" class="hide">
<div class="c">
<h3 id="ft">Add equipment</h3>
<label>Equipment number</label><input id="mid" placeholder="e.g. 330C-01">
<label>Name / Model (optional)</label><input id="mnm" placeholder="CAT 330C">
<label>Filters</label>
<div id="rows"></div>
<div class="g"><button id="addr">+ Filter</button><button id="save" class="p">Save</button></div>
<div class="g"><button id="clr">Clear form</button></div>
</div>

<div class="c">
<h3>Saved equipment</h3>
<div id="list"></div>
</div>

<div class="c">
<h3>Import from Excel</h3>
<div class="t" style="font-size:14px;margin-bottom:8px">Paste rows with columns: equipment number, filter type, filter number, brand, quantity (brand and quantity are optional)</div>
<textarea id="imp" rows="5" style="direction:ltr"></textarea>
<div class="g"><button id="doimp" class="p">Import</button></div>
</div>

<div class="c">
<h3>Backup</h3>
<div class="g"><button id="exp">Copy data</button><button id="rst" class="d">Delete all</button></div>
<textarea id="bk" rows="3" class="hide" style="direction:ltr;margin-top:8px"></textarea>
</div>
</section>
</div>

<script>
const TYPES=["Engine oil filter","Fuel filter","Fuel filter (water separator)","Outer air filter","Inner air filter","Hydraulic filter","Transmission oil filter","Breather filter","A/C filter","Other"];
let db=[],fdb=null,canW=false,ready=false,msg="";
function mkey(id){return encodeURIComponent(norm(id)).replace(/%/g,"~").replace(/[!'()*]/g,c=>"~"+c.charCodeAt(0).toString(16))}
async function put(m){if(!fdb||!canW)return false;try{await fdb.doc("machines/"+mkey(m.id)).set(m);return true}catch(e){alert("Could not save");return false}}
async function del(m){try{await fdb.doc("machines/"+mkey(m.id)).delete()}catch(e){alert("Could not delete")}}
function subscribe(){fdb.collection("machines").onSnapshot(sn=>{db=sn.docs.map(d=>d.data()).sort((a,b)=>String(a.id).localeCompare(String(b.id),"en"));ready=true;search();renderList()},e=>{msg="Could not load data";search()})}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[\s\-_]/g,"");
let editId=null;

function show(n){document.body.classList.toggle("home",n===1);$("s1").classList.toggle("hide",n!==1);$("s2").classList.toggle("hide",n!==2);$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":"";if(n===1)search();else renderList()}
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);

function card(m){
  const f=m.filters.length?m.filters.map(x=>`<div class="r"><span class="t">${esc(x.type)}${x.brand?`<br><b style="color:var(--tx)">${esc(x.brand)}</b>`:""}</span><span class="n">${esc(x.number)}${x.qty?` ×${esc(x.qty)}`:""}</span></div>`).join(""):`<div class="t">No filters recorded</div>`;
  return `<div class="c"><h3>${esc(m.id)}${m.name?` — ${esc(m.name)}`:""}</h3>${f}</div>`;
}
function search(){
  const q=norm($("q").value);
  const el=$("res");
  if(msg){el.innerHTML=`<div class="m">${msg}</div>`;return}
  if(!ready){el.innerHTML=`<div class="m">Loading...</div>`;return}
  if(!db.length){el.innerHTML=`<div class="m">${canW?"No equipment yet.<br>Add some from the “Manage Data” tab.":"No equipment has been added yet"}</div>`;return}
  if(!q){el.innerHTML=`<div class="m">Enter an equipment number to see its filters</div>`;return}
  const ex=db.filter(m=>norm(m.id)===q);
  const hits=ex.length?ex:db.filter(m=>norm(m.id).includes(q)||norm(m.name||"").includes(q));
  el.innerHTML=hits.length?hits.map(card).join(""):`<div class="m">No equipment found with this number</div>`;
}
$("q").oninput=search;

function addRow(f={}){
  const d=document.createElement("div");d.className="row";
  const opts=TYPES.map(t=>`<option${t===f.type?" selected":""}>${t}</option>`).join("");
  d.innerHTML=`<select>${opts}</select><input placeholder="Filter number" style="direction:ltr" value="${esc(f.number||"")}"><input placeholder="Brand (e.g. Donaldson)" value="${esc(f.brand||"")}"><input placeholder="Qty" inputmode="numeric" value="${esc(f.qty||"")}"><button class="d">✕</button>`;
  d.querySelector("button").onclick=()=>d.remove();
  $("rows").appendChild(d);
}
$("addr").onclick=()=>addRow();
function clearForm(){editId=null;$("mid").value="";$("mnm").value="";$("rows").innerHTML="";$("ft").textContent="Add equipment";addRow()}
$("clr").onclick=clearForm;

$("save").onclick=async()=>{
  const id=$("mid").value.trim();
  if(!id){alert("Enter the equipment number");return}
  const filters=[...$("rows").children].map(r=>{const[s,n,b,q]=[r.children[0].value,r.children[1].value.trim(),r.children[2].value.trim(),r.children[3].value.trim()];return{type:s,number:n,brand:b,qty:q}}).filter(x=>x.number);
  const m={id,name:$("mnm").value.trim(),filters};
  if(editId&&mkey(editId)!==mkey(id)){const o=db.find(x=>mkey(x.id)===mkey(editId));if(o)await del(o)}
  if(await put(m))clearForm();
};

function renderList(){
  $("list").innerHTML=db.length?db.map((m,i)=>`<div class="r"><span><b>${esc(m.id)}</b> <span class="t">${esc(m.name||"")} · ${m.filters.length} filters</span></span><span><button data-e="${i}">Edit</button> <button class="d" data-d="${i}">Delete</button></span></div>`).join(""):`<div class="t">Nothing yet</div>`;
  $("list").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const m=db[+b.dataset.e];editId=m.id;$("mid").value=m.id;$("mnm").value=m.name||"";$("rows").innerHTML="";m.filters.forEach(addRow);$("ft").textContent="Edit equipment";scrollTo(0,0)});
  $("list").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("Delete this equipment?")){del(db[+b.dataset.d])}});
}

$("doimp").onclick=async()=>{
  const lines=$("imp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const map={};let n=0;
  lines.forEach(l=>{
    const p=l.split(/\t|\||;|,/).map(x=>x.trim());
    if(p.length<3)return;
    const[id,type,num,brand,qty]=p;
    const k=mkey(id);
    let m=map[k];
    if(!m){const o=db.find(x=>mkey(x.id)===k);m=map[k]=o?JSON.parse(JSON.stringify(o)):{id,name:"",filters:[]}}
    m.filters.push({type,number:num,brand:brand||"",qty:qty||""});n++;
  });
  for(const k in map){await put(map[k])}
  $("imp").value="";alert(`Imported ${n} filters`);
};

$("exp").onclick=()=>{const t=$("bk");t.classList.remove("hide");t.value=JSON.stringify(db);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}};
$("rst").onclick=async()=>{if(confirm("Delete all data?")){for(const m of [...db])await del(m)}};
